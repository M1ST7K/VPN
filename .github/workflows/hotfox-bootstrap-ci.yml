name: HotFox bootstrap and Android CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hotfox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-integrity:
    name: Payload integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact bootstrap payload
        run: bash bootstrap/verify_payload.sh

  reconstruct-and-build:
    name: Reconstruct and build Android app
    needs: payload-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build prerequisites and Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils rsync binutils
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # Android 17 / API 37 is published as a minor-versioned platform package.
          # Plain platforms;android-37 does not exist during this release cycle.
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;${NDK_VERSION}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-37.0"
          test -x "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/ndk-build"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Reconstruct HotFox 2.1.0 baseline and apply 2.2.0 overlay
        run: bash bootstrap/bootstrap_source.sh

      - name: Verify HotFox 2.2.0 source overlay
        run: bash bootstrap/verify_hotfox_2_2_0.sh

      - name: Static check 2.2.0
        run: python3 verification/static_check_2_2_0.py

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assemblePlaystoreDebug

      - name: Unit tests
        working-directory: V2rayNG
        run: ./gradlew --no-daemon --stacktrace :app:testPlaystoreDebugUnitTest

      - name: Android lint
        working-directory: V2rayNG
        run: ./gradlew --no-daemon --stacktrace :app:lintPlaystoreDebug

      - name: Verify unsigned release compilation
        working-directory: V2rayNG
        run: ./gradlew --no-daemon --stacktrace :app:assemblePlaystoreRelease

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotfox-playstore-debug-apks-${{ github.event_name }}-${{ github.run_id }}
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfox-lint-reports-${{ github.event_name }}-${{ github.run_id }}
          path: |
            V2rayNG/app/build/reports/lint-results-*.html
            V2rayNG/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
