name: HotFox AI Checkpoint Reviewer

on:
  # Ordinary PR pushes run only the tiny checkpoint gate. OpenAI is not called,
  # and OPENAI_API_KEY is not exposed to a job, unless the final head commit
  # explicitly contains [hotfox-review]. Phase-exit automation uses
  # workflow_dispatch only after green CI and passes review_mode=phase_exit.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review now"
        required: true
        type: string
      expected_sha:
        description: "Exact PR head SHA that passed green CI (required for phase_exit)"
        required: false
        type: string
      review_mode:
        description: "manual checkpoint or automatic engineering phase exit"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - phase_exit

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: hotfox-ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ inputs.expected_sha || github.event.pull_request.head.sha || 'none' }}
  cancel-in-progress: true

jobs:
  checkpoint-gate:
    name: Check whether this head requests AI review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       startsWith(github.event.pull_request.head.ref, 'cursor/hotfox-'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      requested: ${{ steps.gate.outputs.requested }}
    steps:
      - id: gate
        name: Detect explicit checkpoint token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REVIEW_MODE: ${{ inputs.review_mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "${REVIEW_MODE:-manual}" == "phase_exit" ]]; then
              if [[ -z "${EXPECTED_SHA:-}" ]]; then
                echo "requested=false" >> "$GITHUB_OUTPUT"
                echo "phase_exit dispatch missing expected_sha; refusing review."
                exit 0
              fi
              actual="$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          pr = os.environ['PR_NUMBER']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'hotfox-ai-checkpoint-gate/1.0',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          print(((data.get('head') or {}).get('sha') or '').strip())
          PY
          )"
              if [[ "$actual" != "$EXPECTED_SHA" ]]; then
                echo "requested=false" >> "$GITHUB_OUTPUT"
                echo "PR head ${actual} != expected ${EXPECTED_SHA}; refusing review."
                exit 0
              fi
              message="$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          sha = os.environ['EXPECTED_SHA']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/commits/{sha}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'hotfox-ai-checkpoint-gate/1.0',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          print(((data.get('commit') or {}).get('message') or '').strip())
          PY
          )"
              if ! grep -Fqi '[hotfox-phase-exit]' <<< "$message"; then
                echo "requested=false" >> "$GITHUB_OUTPUT"
                echo "expected SHA lacks [hotfox-phase-exit]; refusing review."
                exit 0
              fi
            fi
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch requests a checkpoint review."
            exit 0
          fi

          message="$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          sha = os.environ['HEAD_SHA']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/commits/{sha}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'hotfox-ai-checkpoint-gate/1.0',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          print(((data.get('commit') or {}).get('message') or '').strip())
          PY
          )"

          if grep -Fqi '[hotfox-review]' <<< "$message"; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "Manual checkpoint token found; senior AI review will run."
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "Ordinary push; OpenAI review skipped."
          fi

  review:
    name: GPT-5.6 checkpoint review → Cursor only for P0/P1
    needs: checkpoint-gate
    if: needs.checkpoint-gate.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      approved: ${{ steps.run.outputs.approved }}
      reviewed_sha: ${{ steps.run.outputs.reviewed_sha }}
      verdict: ${{ steps.run.outputs.verdict }}

    steps:
      # pull_request_target/workflow_dispatch intentionally checks out ONLY trusted main.
      # Never checkout or execute PR-head code in a job that can access OPENAI_API_KEY.
      - name: Checkout trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate OpenAI secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets." >&2
            exit 2
          fi

      - id: run
        name: Run trusted checkpoint review
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HOTFOX_REVIEW_MODE: ${{ inputs.review_mode }}
          # Cost-balanced default. Reserve Sol/manual deep review for exceptional
          # security/release cases instead of every normal checkpoint.
          OPENAI_REVIEW_MODEL: gpt-5.6-terra
          # In phase_exit mode the script still runs via workflow_dispatch, but this
          # trigger string is used in any CHANGES_REQUIRED handoff so Cursor retries
          # only after the next green phase-exit candidate.
          HOTFOX_REVIEW_TRIGGER: ${{ inputs.review_mode == 'phase_exit' && '[hotfox-phase-exit]' || '[hotfox-review]' }}
          MAX_REVIEW_ROUNDS: "40"
          # The reviewer already prioritizes VPN/security/commerce-sensitive patches.
          # Keeping a bounded diff prevents giant historical PR context from being
          # resent on every checkpoint.
          MAX_REVIEW_DIFF_CHARS: "120000"
          # 6k previously proved too tight for reasoning+visible output; 12k keeps
          # enough headroom while cutting the old 30k ceiling substantially.
          OPENAI_REVIEW_MAX_OUTPUT_TOKENS: "12000"
        run: python3 .github/scripts/hotfox_ai_review.py

  continue-roadmap:
    name: Wake Cursor only after APPROVED phase exit
    needs: review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.review_mode == 'phase_exit' &&
      needs.review.result == 'success' &&
      needs.review.outputs.approved == 'true' &&
      needs.review.outputs.verdict == 'APPROVED' &&
      needs.review.outputs.reviewed_sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post engineering-complete handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ needs.review.outputs.reviewed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="@cursor Финальный phase-exit review APPROVED (head ${REVIEWED_SHA}): подтверждённых P0/P1 нет. Следуй \`.cursor/rules/20-hotfox-roadmap-progression.mdc\` и \`docs/HOTFOX_ROADMAP.md\`: зафиксируй текущий этап как \`ENGINEERING COMPLETE — physical release validation deferred\`, обнови trusted current-phase context на следующий этап и сразу продолжай следующий roadmap phase. Не запрашивай physical Android test до \`FINAL RELEASE DEVICE GATE\`. Для следующего этапа используй обычные commits без AI review; только финальный green-CI candidate пометь \`[hotfox-phase-exit]\`."
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
