name: HotFox AI Checkpoint Reviewer

on:
  # Ordinary pushes still trigger this tiny trusted job, but the script exits
  # before any OpenAI call unless the PR head commit contains [hotfox-review].
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review now"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: hotfox-ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: GPT-5.6 Sol checkpoint review → Cursor only for P0/P1
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       startsWith(github.event.pull_request.head.ref, 'cursor/hotfox-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # pull_request_target intentionally checks out ONLY trusted main.
      # Never checkout or execute PR-head code in a job that can access OPENAI_API_KEY.
      - name: Checkout trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate OpenAI secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets." >&2
            exit 2
          fi

      - name: Check checkpoint and review only when requested
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: gpt-5.6-sol
          HOTFOX_REVIEW_TRIGGER: "[hotfox-review]"
          MAX_REVIEW_ROUNDS: "10"
          MAX_REVIEW_DIFF_CHARS: "280000"
          OPENAI_REVIEW_MAX_OUTPUT_TOKENS: "30000"
        run: python3 .github/scripts/hotfox_ai_review.py
